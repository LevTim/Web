<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Калькулятор навантажень (метод УД)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f4f4f4;
    }
    h1 {
      color: #2c3e50;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: white;
    }
    th, td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: center;
    }
    th {
      background: #3498db;
      color: white;
    }
    input {
      width: 80px;
      padding: 4px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #27ae60;
      color: white;
      border: none;
      cursor: pointer;
    }
    .result {
      margin-top: 25px;
      padding: 15px;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 0 5px #ccc;
    }
  </style>
</head>
<body>

  <h1>Калькулятор електричних навантажень (метод упорядкованих діаграм)</h1>

  <table>
    <thead>
      <tr>
        <th>n</th>
        <th>Рн (кВт)</th>
        <th>η</th>
        <th>cos φ</th>
        <th>U (кВ)</th>
        <th>Кв</th>
        <th>tg φ</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><input type="number" id="n" value="4" /></td>
        <td><input type="number" id="Pn" value="29" /></td>
        <td><input type="number" step="0.01" id="eta" value="0.92" /></td>
        <td><input type="number" step="0.01" id="cosphi" value="0.9" /></td>
        <td><input type="number" step="0.01" id="U" value="0.38" /></td>
        <td><input type="number" step="0.01" id="kv" value="0.2" /></td>
        <td><input type="number" step="0.01" id="tgphi" value="1.33" /></td>
      </tr>
    </tbody>
  </table>

  <button onclick="calculate()">Розрахувати</button>

  <div class="result" id="results"></div>

  <script>
    function calculate() {
      const n = parseFloat(document.getElementById('n').value);
      const Pn = parseFloat(document.getElementById('Pn').value);
      const eta = parseFloat(document.getElementById('eta').value);
      const cosphi = parseFloat(document.getElementById('cosphi').value);
      const U = parseFloat(document.getElementById('U').value);
      const kv = parseFloat(document.getElementById('kv').value);
      const tgphi = parseFloat(document.getElementById('tgphi').value);

      // 1. Загальна номінальна потужність
      const P_nom = n * Pn;

      // 2. Середня активна потужність
      const P_avg = P_nom * kv;

      // 3. Середня реактивна потужність
      const Q_avg = P_avg * tgphi;

      // 4. Повна потужність
      const S = Math.sqrt(P_avg**2 + Q_avg**2);

      // 5. Розрахунковий струм
      const Ip = P_nom / (eta * cosphi * Math.sqrt(3) * U);

      // 6. Ефективна кількість ЕП
      const ne = 1; // для одного типу ЕП приймаємо 1

      // 7. Коефіцієнт використання груповий
      const Kv_group = kv;

      // 8. Коефіцієнт максимуму активної потужності (з таблиці – припустимо)
      const Kr = 1.25;

      // 9. Розрахункове активне навантаження
      const Pp = Kr * Kv_group * P_nom;

      // 10. Розрахункове реактивне навантаження
      const Qp = Kr * Kv_group * P_nom * tgphi;

      // 11. Повна потужність
      const Sp = Math.sqrt(Pp**2 + Qp**2);

      // 12. Груповий струм
      const Ip_group = Pp / (U * Math.sqrt(3));

      document.getElementById('results').innerHTML = `
        <h3>Результати розрахунку:</h3>
        <p><strong>Номінальна потужність:</strong> ${P_nom.toFixed(2)} кВт</p>
        <p><strong>Середня активна потужність (Pср):</strong> ${P_avg.toFixed(2)} кВт</p>
        <p><strong>Середня реактивна потужність (Qср):</strong> ${Q_avg.toFixed(2)} квар</p>
        <p><strong>Повна потужність (S):</strong> ${S.toFixed(2)} кВА</p>
        <p><strong>Розрахунковий струм одного ЕП (Ip):</strong> ${Ip.toFixed(2)} А</p>
        <hr />
        <p><strong>Груповий коефіцієнт використання (Кв):</strong> ${Kv_group.toFixed(2)}</p>
        <p><strong>Ефективна кількість ЕП (ne):</strong> ${ne}</p>
        <p><strong>Коефіцієнт максимуму (Kр):</strong> ${Kr}</p>
        <p><strong>Розрахункове активне навантаження (Pp):</strong> ${Pp.toFixed(2)} кВт</p>
        <p><strong>Розрахункове реактивне навантаження (Qp):</strong> ${Qp.toFixed(2)} квар</p>
        <p><strong>Повна потужність (Sp):</strong> ${Sp.toFixed(2)} кВА</p>
        <p><strong>Груповий розрахунковий струм (Ip груповий):</strong> ${Ip_group.toFixed(2)} А</p>
      `;
    }
  </script>

</body>
</html>
